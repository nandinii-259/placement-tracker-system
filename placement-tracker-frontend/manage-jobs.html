<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Jobs — Placement Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <h1>Placement Tracker (Admin)</h1>
        <div class="nav-links">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="companies.html">Companies</a>
            <a href="manage-jobs.html">Jobs</a>
            <a href="manage-applications.html">Applications</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <h2>Manage Jobs</h2>

        <div class="add-form">
            <h3>Post New Job</h3>
            <form id="jobForm">
                <label for="companySelect">Company</label>
                <select id="companySelect" required></select>

                <label for="title">Job Title</label>
                <input type="text" id="title" required>

                <label for="description">Description</label>
                <input type="text" id="description">

                <label for="minCgpa">Minimum CGPA</label>
                <input type="number" id="minCgpa" step="0.01" min="0" max="10" required>

                <label for="deadline">Application Deadline</label>
                <input type="date" id="deadline" required>

                <button type="submit">Post Job</button>
            </form>
            <p id="statusMessage" class="error-message"></p>
        </div>

        <div id="jobsList" class="applications-list"></div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/manage-jobs.js"></script>
</body>
</html>
