<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard — Placement Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar">
        <h1>Placement Tracker</h1>
        <div class="nav-links">
            <a href="student-dashboard.html">Dashboard</a>
            <a href="jobs.html">Browse Jobs</a>
            <a href="my-applications.html">My Applications</a>
            <a href="#" id="logoutLink">Logout</a>
        </div>
    </nav>

    <div class="dashboard-container">
        <h2>Welcome, <span id="studentName">Student</span></h2>
        <p>Branch: <span id="studentBranch">-</span> | CGPA: <span id="studentCgpa">-</span></p>

        <div class="dashboard-cards">
            <div class="card">
                <h3 id="totalApplications">0</h3>
                <p>Applications Submitted</p>
            </div>
            <div class="card">
                <h3 id="totalInterviews">0</h3>
                <p>Interviews Scheduled</p>
            </div>
            <div class="card">
                <h3 id="totalOffers">0</h3>
                <p>Offers Received</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/student-dashboard.js"></script>
</body>
</html>
